name: HP-48GX original Operation Index extraction (unverified OCR)

on:
  push:
    paths:
      - 'scripts/extract_hp48gx_operation_index.py'
      - '.github/workflows/hp48gx-source-extraction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR tools
        run: |
          python -m pip install --quiet pymupdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
      - name: Fetch pinned original HP 48G Series User's Guide (temporary only)
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --connect-timeout 10 --max-time 110             'https://www.hp.com/ctg/Manual/c00442262.pdf'             -o /tmp/hp48gx-original-user-guide.pdf
          echo 'Checksum of original guide:'
          sha256sum /tmp/hp48gx-original-user-guide.pdf
      - name: Read every Operation Index table page by OCR
        run: |
          python3 scripts/extract_hp48gx_operation_index.py             /tmp/hp48gx-original-user-guide.pdf             --baseline docs/reference/hp48gx-rom-index-baseline.json             --output docs/reference/hp48gx-operation-index-ocr.json             --report docs/de/HP-48GX-OPERATION-INDEX-ROHABGLEICH.md
      - name: Commit reproducible *unverified* source-index candidates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reference/hp48gx-operation-index-ocr.json                   docs/de/HP-48GX-OPERATION-INDEX-ROHABGLEICH.md
          if git diff --cached --quiet; then
            echo 'No changes in source-index candidates.'
            exit 0
          fi
          git commit -m 'docs: add OCR candidates from all 57 HP48GX Operation Index table pages (unverified)'
          git pull --rebase origin main
          git push origin HEAD:main
